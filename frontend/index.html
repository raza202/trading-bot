<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IKRAAZ Dashboard</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
      .container { max-width: 980px; margin: 40px auto; padding: 24px; background: #111827; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>IKRAAZ Stock Dashboard (Top 10 PSX)</h1>
      <label>Timeframe: <select id="timeframe"><option>15m</option><option>30m</option><option>1h</option></select></label>
      <table><thead><tr><th>Symbol</th><th>Name</th><th>Price</th><th>Signal</th><th>Confidence</th></tr></thead><tbody id="stocks-body"></tbody></table>
      <p id="updated-at">Last updated: --</p>
    </div>
    <script>
      const envBase = window.__IKRAAZ_API_BASE_URL__;
      const API_BASE = envBase || new URLSearchParams(window.location.search).get("apiBase") || "http://127.0.0.1:8000";
      const tableBody = document.getElementById("stocks-body");
      const timeframeSelect = document.getElementById("timeframe");
      const updatedAt = document.getElementById("updated-at");
      function renderRows(items) { tableBody.innerHTML = items.map((item) => `<tr><td>${item.symbol}</td><td>${item.name}</td><td>${item.price.toFixed(2)}</td><td>${item.signal}</td><td>${Math.round(item.confidence * 100)}%</td></tr>`).join(""); }
      async function loadData() {
        const response = await fetch(`${API_BASE}/timeframe/${timeframeSelect.value}`);
        const data = await response.json();
        renderRows(data.signals);
        updatedAt.textContent = `Last updated: ${new Date(data.updated_at).toLocaleString()}`;
      }
      timeframeSelect.addEventListener("change", loadData);
      loadData();
    </script>
  </body>
</html>

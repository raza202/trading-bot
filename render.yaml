services:
  - type: web
    name: trading-bot-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_SOURCE
        value: mock
      - key: TRADINGVIEW_USERNAME
        sync: false
      - key: TRADINGVIEW_PASSWORD
        sync: false
